<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartAI Developer Console</title>
    <link href="https://cloudflare.com" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0d1117;
            --panel-dark: #161b22;
            --border-color: #30363d;
            --text-main: #c9d1d9;
            --text-muted: #8b949e;
            --accent-blue: #58a6ff;
            --accent-green: #2ea44f;
        }

        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            display: flex;
            height: 100vh;
        }

        /* डायरेक्ट डैशबोर्ड दिखाने के लिए फ्लेक्स सेट किया */
        .dashboard-layout {
            display: flex;
            width: 100%;
            height: 100vh;
        }

        .sidebar {
            width: 280px;
            background-color: var(--panel-dark);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            padding: 20px;
        }

        .logo {
            font-size: 22px;
            font-weight: bold;
            color: white;
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 30px;
        }

        .logo span {
            color: var(--accent-green);
        }

        .btn-generate {
            background-color: var(--accent-green);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 14px;
        }

        .keys-section {
            margin-top: 25px;
            flex-grow: 1;
            overflow-y: auto;
        }

        .keys-title {
            font-size: 12px;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 10px;
        }

        .key-item {
            background: rgba(255, 255, 255, 0.05);
            padding: 10px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            margin-bottom: 8px;
            font-family: monospace;
            font-size: 13px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .main-content {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            padding: 30px;
            overflow-y: auto;
        }

        .header-panel {
            background-color: var(--panel-dark);
            border: 1px solid var(--border-color);
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 25px;
        }

        .endpoint-box {
            background: #070a0e;
            padding: 12px;
            border-radius: 6px;
            font-family: monospace;
            border: 1px solid var(--border-color);
            color: var(--accent-blue);
            margin-top: 8px;
        }

        .playground-container {
            flex-grow: 1;
            background-color: var(--panel-dark);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            display: flex;
            flex-direction: column;
        }

        .chat-messages {
            flex-grow: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .msg {
            padding: 12px 16px;
            border-radius: 8px;
            max-width: 80%;
            line-height: 1.5;
        }

        .msg.user {
            background: #1f6feb;
            align-self: flex-end;
            color: white;
        }

        .msg.ai {
            background: #21262d;
            align-self: flex-start;
            border: 1px solid var(--border-color);
        }

        .chat-input-area {
            padding: 20px;
            border-top: 1px solid var(--border-color);
            display: flex;
            gap: 10px;
        }

        .chat-input {
            flex-grow: 1;
            background: #070a0e;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 12px;
            color: white;
            font-size: 14px;
        }

        .btn-send {
            background: var(--accent-blue);
            color: white;
            border: none;
            padding: 0 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <!-- 🚀 2. सीधे मुख्य डैशबोर्ड लेआउट (लॉगिन स्क्रीन हमेशा के लिए हटा दी गई) -->
    <div class="dashboard-layout" id="main-dashboard">

        <!-- बाएं हाथ की साइडबार पट्टी -->
        <div class="sidebar">
            <div class="logo"><i class="fas fa-brain"></i> smartAI <span>KEY</span></div>
            <button class="btn-generate" onclick="generateKey()">
                <i class="fas fa-plus"></i> Create SmartAI Key
            </button>

            <div class="keys-section">
                <div class="keys-title">Your Active API Keys</div>
                <div id="keys-list">
                    <!-- चाबियाँ यहाँ दिखाई देंगी -->
                    <div class="key-item"
                        style="color: var(--text-muted); border-style: dashed; justify-content: center;">No active keys
                        found</div>
                </div>
            </div>
        </div>

        <!-- मुख्य प्लेग्राउंड एरिया -->
        <div class="main-content">
            <div class="header-panel">
                <h2 style="margin:0 0 10px 0; color: white;">Developer Cloud Gateway</h2>
                <p style="margin:0; font-size:14px; color:var(--text-muted);">Using Live Server Endpoint:</p>
                <div class="endpoint-box">https://onrender.com</div>
            </div>

            <div class="playground-container">
                <div class="chat-messages" id="chat-box">
                    <div class="msg ai">👋 Welcome to SmartAI Console! Click "Create SmartAI Key" on the left to start
                        testing your live APIs.</div>
                </div>

                <div class="chat-input-area">
                    <input type="text" id="user-query" class="chat-input" placeholder="Ask anything to smartai...">
                    <button class="btn-send" onclick="sendChatMessage()">Run API</button>
                </div>
            </div>
        </div>

    </div>

    <!-- 🛠️ फंक्शनलिटी स्क्रिप्ट जो आपके रेंडर (Render) लाइव सर्वर से बात करेगी -->
    <script>
        const RENDER_BASE_URL = "https://onrender.com";
        let currentActiveKey = "";

        // 🔑 1. लाइव चाबी बनाने का फंक्शन
        async function generateKey() {
            try {
                const response = await fetch(`${RENDER_BASE_URL}/v1/keys/generate`, {
                    method: 'POST'
                });
                const data = await response.json();

                if (data.key) {
                    currentActiveKey = data.key;
                    const keysList = document.getElementById('keys-list');

                    // अगर पहले से 'No active keys' लिखा है तो उसे साफ़ करें
                    if (keysList.innerHTML.includes("No active keys")) {
                        keysList.innerHTML = "";
                    }

                    // नई चाबी लिस्ट में जोड़ें
                    keysList.innerHTML += `<div class="key-item"><span>${data.key.substring(0, 10)}...</span> <i class="fas fa-check-circle" style="color: var(--accent-green)"></i></div>`;

                    alert("🎉 Success! New SmartAI API Key Created.");
                }
            } catch (error) {
                console.error(error);
                alert("❌ Error: Connection failed with Render Cloud Server.");
            }
        }

        // 💬 2. चैट बॉक्स में मैसेज भेजने और AI रिप्लाई लाने का फंक्शन
        async function sendChatMessage() {
            const inputField = document.getElementById('user-query');
            const chatBox = document.getElementById('chat-box');
            const queryText = inputField.value.trim();

            if (!queryText) return;

            // यूजर का मैसेज स्क्रीन पर दिखाएं
            chatBox.innerHTML += `<div class="msg user">${queryText}</div>`;
            inputField.value = "";
            chatBox.scrollTop = chatBox.scrollHeight;

            // AI का लोडिंग मैसेज दिखाएं
            const aiMsgId = "ai-" + Date.now();
            chatBox.innerHTML += `<div class="msg ai" id="${aiMsgId}"><i class="fas fa-spinner fa-spin"></i> SmartAI is thinking...</div>`;
            chatBox.scrollTop = chatBox.scrollHeight;

            try {
                const response = await fetch(`${RENDER_BASE_URL}/v1/chat/completions`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${currentActiveKey}`
                    },
                    body: JSON.stringify({ message: queryText })
                });

                const data = await response.json();
                const aiMessageElement = document.getElementById(aiMsgId);

                if (data.reply) {
                    aiMessageElement.innerHTML = data.reply;
                } else {
                    aiMessageElement.innerHTML = "⚠️ Server responded but no reply found.";
                }
            } catch (error) {
                console.error(error);
                document.getElementById(aiMsgId).innerHTML = "❌ Error: Failed to fetch reply from DeepSeek API via Render Cloud.";
            }
        }
    </script>
</body>

</html>
