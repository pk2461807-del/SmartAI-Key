<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartAI Developer Console</title>
    <link href="https://cloudflare.com" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0d1117;
            --panel-dark: #161b22;
            --border-color: #30363d;
            --text-main: #c9d1d9;
            --text-muted: #8b949e;
            --accent-blue: #58a6ff;
            --accent-green: #2ea44f;
            --accent-red: #f85149;
        }

        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            display: flex;
            height: 100vh;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* 🔐 Auth Container (लॉगिन और साइनअप के लिए) */
        .auth-container {
            background-color: var(--panel-dark);
            border: 1px solid var(--border-color);
            padding: 40px;
            border-radius: 10px;
            width: 100%;
            max-width: 360px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            gap: 20px;
            z-index: 10;
        }

        .auth-header {
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            color: white;
        }

        .auth-header span {
            color: var(--accent-green);
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .input-group label {
            font-size: 13px;
            color: var(--text-muted);
        }

        .auth-input {
            background-color: #070a0e;
            border: 1px solid var(--border-color);
            padding: 12px;
            border-radius: 6px;
            color: white;
            font-size: 14px;
        }

        .btn-auth {
            background-color: var(--accent-blue);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            font-size: 15px;
            transition: 0.2s;
        }

        .btn-auth:hover {
            background-color: #388bfd;
        }

        .switch-mode-text {
            text-align: center;
            font-size: 13px;
            color: var(--text-muted);
            margin-top: 5px;
        }

        .switch-mode-text span {
            color: var(--accent-blue);
            cursor: pointer;
            text-decoration: underline;
        }

        /* 🚀 Main Dashboard Layout */
        .dashboard-layout {
            display: none;
            width: 100%;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
            background-color: var(--bg-dark);
        }

        .sidebar {
            width: 280px;
            background-color: var(--panel-dark);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            padding: 20px;
        }

        .logo {
            font-size: 22px;
            font-weight: bold;
            color: white;
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 30px;
        }

        .logo span {
            color: var(--accent-green);
        }

        .btn-generate {
            background-color: var(--accent-green);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 14px;
        }

        .keys-section {
            margin-top: 25px;
            flex-grow: 1;
            overflow-y: auto;
        }

        .keys-title {
            font-size: 12px;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 10px;
        }

        .key-item {
            background: rgba(255, 255, 255, 0.05);
            padding: 10px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            margin-bottom: 8px;
            font-family: monospace;
            font-size: 13px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .main-content {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            padding: 30px;
            overflow-y: auto;
        }

        .header-panel {
            background-color: var(--panel-dark);
            border: 1px solid var(--border-color);
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 25px;
        }

        .endpoint-box {
            background: #070a0e;
            padding: 12px;
            border-radius: 6px;
            font-family: monospace;
            border: 1px solid var(--border-color);
            color: var(--accent-blue);
            margin-top: 8px;
        }

        .playground-container {
            flex-grow: 1;
            background-color: var(--panel-dark);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            display: flex;
            flex-direction: column;
        }

        .chat-messages {
            flex-grow: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .msg {
            padding: 12px 16px;
            border-radius: 8px;
            max-width: 80%;
            line-height: 1.5;
        }

        .msg.user {
            background: #1f6feb;
            align-self: flex-end;
            color: white;
        }

        .msg.ai {
            background: #21262d;
            align-self: flex-start;
            border: 1px solid var(--border-color);
        }

        .chat-input-area {
            padding: 20px;
            border-top: 1px solid var(--border-color);
            display: flex;
            gap: 10px;
        }

        .chat-input {
            flex-grow: 1;
            background: #070a0e;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 12px;
            color: white;
            font-size: 14px;
        }

        .btn-send {
            background: var(--accent-blue);
            color: white;
            border: none;
            padding: 0 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <!-- 🔐 1. SmartAI सुरक्षित लॉगिन / साइनअप स्क्रीन -->
    <div class="auth-container" id="auth-screen">
        <div class="auth-header" id="auth-title"><i class="fas fa-user-lock"></i> smartAI <span
                style="color: var(--accent-blue);">SIGN IN</span></div>

        <div class="input-group">
            <label>Developer Email ID</label>
            <input type="email" id="email" class="auth-input" value="admin@smartai.com">
        </div>

        <div class="input-group">
            <label>Access Password</label>
            <input type="password" id="password" class="auth-input" value="123456">
        </div>

        <button class="btn-auth" id="auth-main-btn" onclick="handleAuthAction()">Sign In to Console</button>

        <div class="switch-mode-text" id="toggle-text">
            Don't have an account? <span onclick="toggleAuthMode()">Sign Up here</span>
        </div>
    </div>

    <!-- 🚀 2. मुख्य डैशबोर्ड लेआउट (सफल लॉगिन के बाद खुलेगा) -->
    <div class="dashboard-layout" id="main-dashboard">

        <!-- Sidebar पट्टी -->
        <div class="sidebar">
            <div class="logo"><i class="fas fa-brain"></i> smartAI <span>KEY</span></div>
            <button class="btn-generate" onclick="generateKey()">
                <i class="fas fa-plus"></i> Create SmartAI Key
            </button>

            <div class="keys-section">
                <div class="keys-title">Your Active API Keys</div>
                <div id="keys-list">
                    <div class="key-item"
                        style="color: var(--text-muted); border-style: dashed; justify-content: center;">No active keys
                        found</div>
                </div>
            </div>
        </div>

        <!-- Main Content Area -->
        <div class="main-content">
            <div class="header-panel">
                <h2 style="margin:0 0 10px 0; color: white;">Developer Cloud Gateway</h2>
                <p style="margin:0; font-size:14px; color:var(--text-muted);">Using Live Server Endpoint:</p>
                <div class="endpoint-box">https://onrender.com</div>
            </div>

            <div class="playground-container">
                <div class="chat-messages" id="chat-box">
                    <div class="msg ai">👋 Welcome to SmartAI Console! Click "Create SmartAI Key" on the left to start
                        testing your live APIs.</div>
                </div>

                <div class="chat-input-area">
                    <input type="text" id="user-query" class="chat-input" placeholder="Ask anything to SmartAI...">
                    <button class="btn-send" onclick="sendChatMessage()">Run API</button>
                </div>
            </div>
        </div>

    </div>

    <!-- Live System Script -->
    <script>
        const RENDER_BASE_URL = "https://onrender.com";
        let currentActiveKey = "";

        // लोकल डेटाबेस के लिए डिफ़ॉल्ट क्रेडेंशियल्स सेव करना
        let isLoginMode = true;
        let registeredUsers = {
            "admin@smartai.com": "123456"
        };

        // 🔄 लॉगिन और साइनअप मोड के बीच स्विच करने वाला फंक्शन (अब 100% वर्किंग)
        function toggleAuthMode() {
            const authTitle = document.getElementById('auth-title');
            const mainBtn = document.getElementById('auth-main-btn');
            const toggleText = document.getElementById('toggle-text');
            const emailInput = document.getElementById('email');
            const passInput = document.getElementById('password');

            isLoginMode = !isLoginMode;

            if (!isLoginMode) {
                // साइन अप मोड एक्टिव करें
                authTitle.innerHTML = `<i class="fas fa-user-plus"></i> smartAI <span style="color: var(--accent-green);">SIGN UP</span>`;
                mainBtn.innerText = "Register New Account";
                mainBtn.style.backgroundColor = "var(--accent-green)";
                toggleText.innerHTML = `Already have an account? <span onclick="toggleAuthMode()">Sign In here</span>`;
                emailInput.value = "";
                passInput.value = "";
            } else {
                // लॉगिन मोड एक्टिव करें
                authTitle.innerHTML = `<i class="fas fa-user-lock"></i> smartAI <span style="color: var(--accent-blue);">SIGN IN</span>`;
                mainBtn.innerText = "Sign In to Console";
                mainBtn.style.backgroundColor = "var(--accent-blue)";
                toggleText.innerHTML = `Don't have an account? <span onclick="toggleAuthMode()">Sign Up here</span>`;
                emailInput.value = "admin@smartai.com";
                passInput.value = "123456";
            }
        }

        // 🔐 लॉगिन और रजिस्ट्रेशन हैंडल करने का मुख्य फंक्शन
        function handleAuthAction() {
